<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:320px;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;color:#F3EEE2;
background:radial-gradient(900px 420px at 80% -12%,#264660 0%,transparent 62%),linear-gradient(135deg,#101B28,#1B2A3C 72%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(243,238,226,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(243,238,226,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,#000,transparent 78%)}
.wrap{position:relative;display:flex;align-items:center;height:100%;padding:0 64px;gap:54px}
.left{flex:0 0 575px}
.brand{display:flex;align-items:center;gap:18px}
.brand svg{width:64px;height:64px;border-radius:15px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.brand b{font-size:58px;letter-spacing:-1.5px;font-weight:700;line-height:1}
.tag{margin-top:20px;font-size:21px;color:#CBD8E3;letter-spacing:.5px}
.sub{margin-top:10px;font-size:16.5px;color:#8FA6B8}
.feat{margin-top:26px;display:flex;gap:9px;font-size:12.5px;color:#A9BCCB}
.feat span{border:1px solid rgba(169,188,203,.26);padding:6px 12px;border-radius:999px;background:rgba(243,238,226,.03)}
.right{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:10px;height:44px;border-radius:11px;background:rgba(243,238,226,.07);border:1px solid rgba(243,238,226,.15);padding:0 15px;color:#8FA6B8;font-size:13px;margin-bottom:13px}
.dot{width:7px;height:7px;border-radius:50%;background:#D9B24C;box-shadow:0 0 0 3px rgba(217,178,76,.16)}
.card{background:#F3EEE2;color:#1B2A3C;border-radius:14px;padding:6px 18px;box-shadow:0 20px 55px rgba(0,0,0,.38)}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid #E4DCCC}
.row:first-child{border-top:0}
.chip{flex:0 0 auto;font-size:10.5px;padding:3px 8px;border-radius:5px;background:#E2EDF0;color:#2C6070;font-weight:700;letter-spacing:.4px}
.chip.gold{background:#F2E5C6;color:#8A6416}
.chip.purple{background:#EAE4F1;color:#5B4A78}
.row b{font-size:13.5px;display:block;line-height:1.35}
.row small{font-size:11px;color:#6B7B88;display:block;margin-top:3px;line-height:1.4}
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dsh-kb">
        <rect width="64" height="64" rx="15" fill="#1B2A3C"/>
        <rect x="19" y="12" width="29" height="38" rx="3.5" fill="#F3EEE2" opacity="0.42"/>
        <rect x="14" y="17" width="29" height="36" rx="3.5" fill="#F3EEE2"/>
        <g fill="#1B2A3C"><rect x="19.5" y="25" width="18" height="2.6" rx="1.3"/><rect x="19.5" y="31" width="18" height="2.6" rx="1.3"/><rect x="19.5" y="37" width="11" height="2.6" rx="1.3"/></g>
        <path d="M36 17h7v15l-3.5-3-3.5 3z" fill="#D9B24C"/>
      </svg>
      <b>dsh-kb</b>
    </div>
    <div class="tag">DeepSeek Harness 的本机知识库</div>
    <div class="sub">流程、规范、踩坑，收进一个 JSON；对话里按需检索，不灌上下文。</div>
    <div class="feat"><span>两级主题</span><span>自由标签</span><span>全文检索</span><span>零运行时依赖</span></div>
  </div>
  <div class="right">
    <div class="search"><span class="dot"></span>搜索知识库：激活终端、备份、支付…</div>
    <div class="card">
      <div class="row"><span class="chip">公用</span><div><b>Q 盘环境手册</b><small>工具链 / 环境变量 / 新机器接入 / dubious ownership</small></div></div>
      <div class="row"><span class="chip gold">平台</span><div><b>多平台发布基线</b><small>双地区 / 多渠道 / 标识冻结</small></div></div>
      <div class="row"><span class="chip purple">公司</span><div><b>71 Lab 公司状态与资质台账</b><small>工商 / 备案 / 平台账号 / 缺口</small></div></div>
      <div class="row"><span class="chip">公用</span><div><b>密钥与凭据红线</b><small>私钥只在 Q:\env\ssh；泄露判定与回收顺序</small></div></div>
    </div>
  </div>
</div>
</body></html>
